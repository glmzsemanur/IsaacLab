seed: 42


# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  separate: True
  policy:  # see gaussian_model parameters
    class: GaussianMixin
    # clip_actions: False
    # clip_log_std: True
    # min_log_std: -20.0
    # max_log_std: 2.0
    # initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [128, 128, 128]
        activations: elu
    output: ACTIONS
# SAC requires twin critics and target critics to prevent overestimation bias
  critic_1:
    class: DeterministicMixin
    network:
      - name: net
        input: STATES_ACTIONS  # Crucial: SAC critics need both state and action
        layers: [128, 128, 128]
        activations: elu
    output: ONE
  critic_2:
    class: DeterministicMixin
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [128, 128, 128]
        activations: elu
    output: ONE
  target_critic_1:
    class: DeterministicMixin
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [128, 128, 128]
        activations: elu
    output: ONE
  target_critic_2:
    class: DeterministicMixin
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [128, 128, 128]
        activations: elu
    output: ONE


# Rollout memory
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory
  memory_size: -1  # automatically determined (same as agent:rollouts)


# PPO agent configuration (field names are from PPO_DEFAULT_CONFIG)
# https://skrl.readthedocs.io/en/latest/api/agents/ppo.html
agent:
  class: SAC

  rollouts: 32

  gradient_steps: 16            # gradient steps
  batch_size: 4096               # training batch size

  discount_factor: 0.99        # discount factor (gamma)
  polyak: 0.005                # soft update hyperparameter (tau)

  actor_learning_rate: 1.0e-3    # actor learning rate
  critic_learning_rate: 1.0e-3   # critic learning rate
  learning_rate_scheduler: None        # learning rate scheduler class (see torch.optim.lr_scheduler)
  learning_rate_scheduler_kwargs: {}   # learning rate scheduler's kwargs (e.g. {"step_size": 1e-3})

  state_preprocessor: RunningStandardScaler             # state preprocessor class (see skrl.resources.preprocessors)
  state_preprocessor_kwargs: 
    size: OBSERVATIONS        # state preprocessor's kwargs (e.g. {"size": env.observation_space})

  random_timesteps: 0          # random exploration steps
  learning_starts: 1000           # learning starts after this many steps
  grad_norm_clip: 1.0            # clipping coefficient for the norm of the gradients
  learn_entropy: True          # learn entropy
  entropy_learning_rate: 1.0e-3  # entropy learning rate
  initial_entropy_value: 0.2   # initial entropy value
  target_entropy: null         # target entropy
  rewards_shaper: None         # rewards shaping function: Callable(reward, timestep, timesteps) -> reward
  mixed_precision: False       # enable automatic mixed precision for higher performance
  experiment: 
    directory: "unitree_a1_flat_sac"            # experiment's parent directory
    experiment_name: ""      # experiment name
    write_interval: 100   # TensorBoard writing interval (timesteps)
    checkpoint_interval: 2000      # interval for checkpoints (timesteps)
    store_separately: True          # whether to store checkpoints separately
    wandb: True             # whether to use Weights & Biases
    wandb_kwargs:
      project: "A1_Isaac_sac"
      name: "default_sac"        # wandb kwargs (see https://docs.wandb.ai/ref/python/init)

# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer
  timesteps: 7200
  environment_info: log


 