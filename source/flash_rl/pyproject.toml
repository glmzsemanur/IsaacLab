[build-system]
requires = ["setuptools<82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-rl"
version = "0.1.0"
description = "FlashSAC RL library — IsaacLab-integrated source"
requires-python = ">=3.10"
dependencies = [
    "hydra-core",
    "omegaconf",
    "tqdm",
    "numpy",
    "wandb",
    "tensorboard",
    "termcolor",
    "imageio",
    "moviepy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["flash_rl*"]
